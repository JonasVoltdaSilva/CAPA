services:
  - type: web
    name: capa
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /tmp/capa-data
      - key: TRUST_PROXY
        value: loopback
      - key: APP_ORIGIN
        sync: false
      - key: MUSICBRAINZ_CONTACT
        sync: false
